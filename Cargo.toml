[workspace]
resolver = "2"
members = ["lessons/*", "max_int_value_in_different_languages/max_int_in_rust"]

[workspace.package]
edition = "2024"
rust-version = "1.85.0"



[workspace.lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused = "allow"
unused_mut = "allow"

[package]
name = "opentelemetry_gcloud_monitoring_exporter"

[lib]
doctest = false

[dependencies]
rand = "0.10.1"
